[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "visual-pose"
version = "0.1.0"
description = "Learned visual correspondence and geometric pose estimation"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "pillow",
    "pyyaml",
    "matplotlib",
    "scipy",            # Rotation.from_quat in data_utils.dataset
    "opencv-python",    # imread / cvtColor in data_utils.dataset
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "optuna",           # experiments.sweep
    "pybind11-stubgen", # regenerate _geometry.pyi after changing bindings:
                        #   pybind11-stubgen visual_pose._geometry -o python/
    "pybind11>=2.12",   # also here, not just build-system: CLion configures
                        # outside pip's isolated build env and needs
                        # -Dpybind11_DIR=$(.venv/bin/python -m pybind11 --cmakedir)
]

[tool.scikit-build]
# Package lives under python/, not the repo root, so this must be explicit.
wheel.packages = ["python/visual_pose"]
# RelWithDebInfo, not Debug: still carries symbols so CLion can break inside C++
# called from Python, but Debug means -O0, and Eigen is templated expression code
# that lives or dies on inlining.
cmake.build-type = "RelWithDebInfo"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.editable]
# rebuild=true recompiles on import, so editing C++ needs no reinstall. It adds
# a CMake no-op check (~1s) to every interpreter start; set false if that grates.
mode = "redirect"
rebuild = true
verbose = false

