[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-pose"
version = "0.1.0"
description = "Learned visual correspondence and geometric pose estimation"
requires-python = ">=3.11"

dependencies = [
    "numpy",
    "torch",
    "torchvision",
    "pillow",
    "pyyaml",
    "matplotlib",
    "scipy",            # Rotation.from_quat in data_utils.dataset
    "opencv-python",    # imread / cvtColor in data_utils.dataset
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "optuna",           # experiments.sweep
]

[tool.setuptools.packages.find]
where = ["python"]